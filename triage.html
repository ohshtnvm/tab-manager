<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="triage-container">
    <div id="progress"></div>
    <img id="tab-preview" alt="tab screenshot">
    <div id="tab-info">
      <h3 id="tab-title"></h3>
      <p id="tab-url"></p>
    </div>
    <div id="actions">
      <button id="keep-btn">Keep</button>
      <button id="close-btn">Close</button>
      <button id="bookmark-btn">Bookmark</button>
    </div>
    <div id="board-select" style="display:none;">
      <label for="board-pick">Save to board:</label>
      <select id="board-pick"></select>
      <input type="text" id="new-board" placeholder="New board name" style="display:none;">
      <button id="save-btn">Save</button>
    </div>
    <div id="nav">
      <button id="view-boards-btn">View Boards</button>
    </div>
  </div>
  <script src="triage.js"></script>
</body>
</html>
